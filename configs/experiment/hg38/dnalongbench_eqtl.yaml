# @package _global_
defaults:
  - /pipeline: dnalongbench_450k
  - /model: ???
  - override /scheduler: cosine_warmup_timm

dataset:
  task_name: eqtl
  subset: Cells_Cultured_fibroblasts
  max_length: 450000
  batch_size: 1
  batch_size_eval: 1
  rc_aug: false
  reverse_aug: false

loader:
  num_workers: 0
  pin_memory: true
  drop_last: false

task:
  _name_: eqtl_pair
  loss:
    _name_: cross_entropy
  metrics:
    - accuracy
    - roc_auc_macro
    - auprc_macro
  torchmetrics: null

decoder:
  _name_: pair_sequence
  mode: pool

trainer:
  max_epochs: 30
  precision: 32
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0

optimizer:
  lr: 6e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]

scheduler:
  t_in_epochs: false
  t_initial: 30000
  warmup_t: 300
  warmup_lr_init: 1e-6
  lr_min: 6e-5
