# @package _global_
defaults:
  - /pipeline: dnalongbench_450k
  - /model: ???
  - override /scheduler: proportional_cosine_warmup_timm

dataset:
  task_name: etgp
  subset: null
  train_len: 2066
  max_length: 450000
  batch_size: 1
  batch_size_eval: 1
  rc_aug: false
  reverse_aug: false
  conjoin_train: false
  conjoin_test: false

loader:
  num_workers: 0
  pin_memory: true
  drop_last: false

callbacks:
  model_checkpoint_every_epoch:
    monitor: null
    save_top_k: -1
    save_last: false
    dirpath: checkpoints/
    filename: epoch-{epoch}
    auto_insert_metric_name: false
    verbose: true
    every_n_epochs: 1

trainer:
  max_epochs: 5
  precision: bf16
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0

optimizer:
  lr: 6e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]

scheduler:
  t_in_epochs: false
  t_initial: ${eval:${div_up:${dataset.train_len}, ${train.global_batch_size}} * ${trainer.max_epochs}}
  warmup_t: ${eval:int(${div_up:${dataset.train_len}, ${train.global_batch_size}} * ${trainer.max_epochs} * 0.15)}
  warmup_lr_init_rate: 0.0016666666666666668
  lr_min_rate: 0.1

train:
  seed: ???  # One of the two prescribed seeds: 2222 or 3333.
  global_batch_size: 8
  backbone_lr: ???
  test: false
