# @package _global_
defaults:
  - /trainer: default
  - /loader: default
  - /dataset: dnalongbench_450k
  - /optimizer: adamw
  - /scheduler: cosine_warmup_timm
  - /callbacks: [base, checkpoint]

train:
  monitor: val/roc_auc_macro
  mode: max

encoder: id

task:
  _name_: base
  loss:
    _name_: cross_entropy
  metrics:
    - accuracy
    - roc_auc_macro
    - auprc_macro
  torchmetrics: null

decoder:
  _name_: sequence
  mode: pool
