# Flipped-GARI backbone used for causal-eQTL VEP.
_name_: dna_embedding_flipped_gari
vocab_size: 12
d_model: 192
n_layer: 12
kernel_size: 4
d_state: 16
d_conv: 4
expand: 2
head_dim: 16
dropout_rate1: 0.08
num_heads: 3
dropout_rate2: 0.08
drop_path_rate: 0.18
embed_dropout: 0.0
pad_token_id: 4
conjoin_train: false
conjoin_test: false
cls_rope_mode: null
enable_cross_attention: true
discrepancy_mode: squared_difference
rope_interleaved: false
zero_init_residual: false
