# Randomly initialized Caduceus-PH architecture matching the published 1k small checkpoint config.
_name_: dna_embedding_caduceus
config:
  _target_: caduceus.configuration_caduceus.CaduceusConfig
  d_model: 118
  n_layer: 4
  vocab_size: 16
  ssm_cfg:
    d_state: 16
    d_conv: 4
    expand: 2
    dt_rank: auto
    dt_min: 0.001
    dt_max: 0.1
    dt_init: random
    dt_scale: 1.0
    dt_init_floor: 0.0001
    conv_bias: true
    bias: false
    use_fast_path: true
  rms_norm: true
  residual_in_fp32: false
  fused_add_norm: true
  pad_vocab_size_multiple: 8
  norm_epsilon: 1e-5
  initializer_cfg:
    initializer_range: 0.02
    n_residuals_per_layer: 1
    rescale_prenorm_residual: true
  bidirectional: true
  bidirectional_strategy: add
  bidirectional_weight_tie: true
  rcps: false
  complement_map: null
conjoin_train: false
conjoin_test: false
