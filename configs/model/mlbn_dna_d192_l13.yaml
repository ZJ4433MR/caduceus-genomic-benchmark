# DNA-token MLBN backbone for parameter-close VEP comparison against
# Caduceus PS/PH 131k d_model=256 n_layer=16 models.
_name_: dna_embedding_mlbn
vocab_size: 12
d_model: 192
n_layer: 13
kernel_size: 4
d_state: 16
d_conv: 4
expand: 2
head_dim: 16
dropout_rate1: 0.08
num_heads: 3
dropout_rate2: 0.08
drop_path_rate: 0.18
embed_dropout: 0.0
pad_token_id: 4
conjoin_train: false
conjoin_test: false
